{% extends "base.html" %}{% block content %}<h1>⚙️ Store Settings</h1><div class="admin-nav"><a href="{{url_for('admin_dashboard')}}">📊 Dashboard</a><a href="{{url_for('admin_products')}}">📦 Products</a><a href="{{url_for('admin_inventory')}}">⚠️ Inventory</a><a href="{{url_for('admin_orders')}}">🧾 Orders</a><a href="{{url_for('admin_customers')}}">👥 Customers</a><a href="{{url_for('admin_reviews')}}">⭐ Reviews</a><a href="{{url_for('admin_notifications')}}">🔔 Notifications</a><a href="{{url_for('admin_offers')}}">🎁 Offers</a><a href="{{url_for('admin_analytics')}}">📈 Analytics</a><a href="{{url_for('expense_manager')}}">💸 Expenses</a><a href="{{url_for('admin_qr')}}">🔳 Store QR</a><a href="{{url_for('admin_settings')}}">⚙️ Settings</a></div><section class="admin-form"><form method="post" class="form-grid"><input name="store_name" value="{{settings.store_name}}" placeholder="Store Name"><input name="store_phone" value="{{settings.store_phone}}" placeholder="Store Phone"><input name="whatsapp" value="{{settings.whatsapp}}" placeholder="WhatsApp Number"><input name="upi_id" value="{{settings.upi_id}}" placeholder="UPI ID"><input name="public_url" value="{{settings.public_url}}" placeholder="Public Website URL"><input name="address" value="{{settings.address}}" placeholder="Store Address"><input name="opening_time" value="{{settings.opening_time}}" type="time"><input name="closing_time" value="{{settings.closing_time}}" type="time"><input name="delivery_charge" value="{{settings.delivery_charge}}" type="number" step=".01" placeholder="Delivery Charge"><input name="low_stock_limit" value="{{settings.low_stock_limit}}" type="number" min="0" placeholder="Low Stock Alert Limit"><button class="btn">Save Settings</button></form></section>{% endblock %}
