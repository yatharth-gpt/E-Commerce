{% extends "base.html" %}{% block content %}<div class="auth-box otp-auth"><div class="auth-icon">📱</div><h1>Login to OM KIRANA</h1><p class="muted">Secure mobile OTP login for orders, wishlist and loyalty points.</p>{% if not otp_sent %}<form method="post"><input name="name" placeholder="Your Name"><input name="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit Mobile Number" required><input type="hidden" name="next" value="{{next}}"><input type="hidden" name="action" value="send"><button class="btn">Send OTP 🔐</button></form>{% else %}<form method="post"><input name="name" value="{{name or ''}}" placeholder="Your Name"><input name="phone" value="{{phone}}" readonly><input name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit OTP" required autofocus><input type="hidden" name="next" value="{{next}}"><input type="hidden" name="action" value="verify"><button class="btn">Verify OTP ✓</button></form><form method="post" class="resend"><input type="hidden" name="phone" value="{{phone}}"><input type="hidden" name="next" value="{{next}}"><input type="hidden" name="action" value="send"><button class="btn secondary">Resend OTP</button></form>{% endif %}<small>Demo/local mode is included. For real SMS OTP, connect an SMS provider before publishing publicly.</small></div>{% endblock %}
