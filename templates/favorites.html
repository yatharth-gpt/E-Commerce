{% extends "base.html" %}{% block content %}<h1>❤️ Favourites</h1><div class="grid">{% for p in products %}<div class="card"><div class="product-image">{% if p.image and p.image.startswith('uploads/') %}<img src="{{url_for('static',filename=p.image)}}" alt="{{p.name}}">{% else %}{{p.image if p.image else '🛍️'}}{% endif %}</div><div class="card-body"><h3>{{p.name}}</h3><p class="price">₹{{'%.2f'|format(p.price)}}</p><a class="btn" href="{{url_for('product',product_id=p.id)}}">View</a></div></div>{% else %}<div class="empty">No favourites yet.</div>{% endfor %}</div>{% endblock %}
